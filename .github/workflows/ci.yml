# DRMS CI
# ============================================================================
# Runs on GitHub-hosted runners only (ubuntu-latest). Safe for a PUBLIC
# third-party-owned repo:
#   * fork pull_request runs get NO secrets - DRMS_TEST_JWT_SECRET is
#     optional (backend test setup provides a hardcoded test JWT), so CI
#     passes without it
#   * no self-hosted runner is used here - do NOT add one to this file
#   * push: main runs are for maintainers only
# Keep it that way: never require a secret here, and never route this
# workflow through a self-hosted runner (untrusted PR paths would gain
# code execution on it).
# ============================================================================

name: DRMS CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage
        env:
          CI: true
          NODE_ENV: test
          JWT_SECRET: ${{ secrets.DRMS_TEST_JWT_SECRET }}
          FILE_STORAGE_PATH: ${{ runner.temp }}/drms-uploads
        # NOTE: on fork PRs DRMS_TEST_JWT_SECRET is empty - backend test
        # setup (src/__tests__/setup.js) sets a fixed test JWT, so tests
        # still pass. Do not make this secret required.

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: /api

